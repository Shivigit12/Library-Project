## Dev profile (local development)

# ===============================
# =   PostgreSQL DataSource
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_project}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Localhost@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# =   Hibernate / JPA
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# In dev: recreate tables on each run
spring.jpa.hibernate.ddl-auto=create

# Show SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# =   Security (dev defaults)
# ===============================
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.admin.role=${ADMIN_ROLE:ADMIN}
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-32-chars!!}
app.security.jwt.ttlMillis=${JWT_TTL_MILLIS:3600000}

