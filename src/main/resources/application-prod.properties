## Prod profile (production-safe defaults)
## IMPORTANT: provide DB_* environment variables in production.

# ===============================
# =   PostgreSQL DataSource
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# =   Hibernate / JPA
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# In prod: avoid schema changes at runtime (prefer Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=validate

# Avoid logging SQL in production
spring.jpa.show-sql=false

# ===============================
# =   Security (prod)
# ===============================
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}
app.security.admin.role=${ADMIN_ROLE:ADMIN}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttlMillis=${JWT_TTL_MILLIS:3600000}

